[project]
name = "hinglish-voice-agent"
version = "0.1.0"
description = "A Hinglish voice agent that changes a delivery slot over a live call, and never double-books or falsely confirms."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Mubin Attar" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/mubin-attar-007/hinglish-voice-agent"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2",
    "ruff>=0.17.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_agent", "src/orders", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["voice_agent", "orders", "evals"]

[tool.pyright]
include = ["src", "evals", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
