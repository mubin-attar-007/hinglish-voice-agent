name: Live eval (manual; can cost money)

# Runs corpus v0 against a real Gemini model. Never runs on pull requests or pushes.
# Needs the GEMINI_API_KEY repository secret (a dedicated key for this project).
# The run stops before its list-price cost passes max_usd; on the free tier it costs nothing.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model id (it needs a dated price in voice_agent/llm/pricing.py)"
        default: "gemini-3.8-flash"
        required: true
      k:
        description: "Runs per scenario"
        default: "1"
        required: true
      max_usd:
        description: "Stop before list-price cost passes this many US$"
        default: "1.0"
        required: true

permissions:
  contents: read

concurrency:
  group: live-eval
  cancel-in-progress: false

jobs:
  live:
    name: Corpus v0 against Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked

      - name: Run the evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODEL: ${{ inputs.model }}
          K: ${{ inputs.k }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          uv run python -m evals.harness.run --llm gemini --model "$MODEL" --k "$K" \
            --max-usd "$MAX_USD" --safety full --faults on --out live-results.json

      - name: Upload the results JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-results
          path: live-results.json
          retention-days: 30
