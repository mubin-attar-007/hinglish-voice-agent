# Corpus v0 · interruptions. Synthetic data; the retailer is fictional.

- id: interrupt-demo
  category: interruption
  language: hinglish
  description: >
    The demo. The caller asks for Friday evening, interrupts the agent's offer with "Friday nahi,
    Saturday chaar baje ke baad", picks a slot, and the booking commits and then times out.
  faults: [{kind: timeout_after_commit}]
  caller:
    opening: "Hello, mera order 48291 hai, pincode 380015. Delivery Friday shaam ko kar dijiye."
    facts:
      ids: ["Order 48291, pincode 380015."]
      wish: "Friday shaam ko."
    goals: [{date: 2026-11-28, after: "16:00"}]
    triggers:
      - {when: slot_offer, nth: 1, interrupt_at_word: 5, say: "Friday nahi, Saturday chaar baje ke baad."}
    after_outcome: ["Ho gaya na?"]
    close: "Theek hai, thank you."
  expected: {final_slot: "20261128-1600", writes: 1}

